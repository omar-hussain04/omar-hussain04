<svg xmlns="http://www.w3.org/2000/svg" width="925" height="557" viewBox="0 0 925 557" font-family="Consolas, 'Cascadia Code', Menlo, monospace">

<style>
  .ascii { fill: #00c53f; font-size: 12px; }
  .lbl { fill: #39ff6e; font-size: 13px; font-weight: 600; }
  .val { fill: #d4ffe0; font-size: 13px; }
  .dots { fill: #1f7a38; font-size: 13px; }
  .hdr { fill: #39ff6e; font-size: 14.5px; font-weight: 700; letter-spacing: 1px; }
  .divl { stroke: #1f7a38; stroke-width: 1; }
  .glow { filter: url(#glow); }
  .a-line { opacity: 0; animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  .i-line { opacity: 0; animation: typeIn 0.3s steps(1) forwards; }
  @keyframes typeIn { to { opacity: 1; } }
  .cursor { fill: #39ff6e; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .pulse { animation: pulse 3.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.84; } }
</style>
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="0.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

